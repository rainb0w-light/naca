name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Build, architecture, and quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read cobol-rekt source lock
        id: cobol-rekt-lock
        shell: bash
        run: |
          echo "repository=$(sed -n 's/^repository=//p' gradle/cobol-rekt.properties)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' gradle/cobol-rekt.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.cobol-rekt-lock.outputs.repository }}
          ref: ${{ steps.cobol-rekt-lock.outputs.commit }}
          path: cobol-rekt-src
          submodules: recursive
      - name: Verify cobol-rekt source lock
        shell: bash
        run: |
          test "$(git -C cobol-rekt-src rev-parse HEAD)" = "$(sed -n 's/^commit=//p' gradle/cobol-rekt.properties)"
          test "$(git -C cobol-rekt-src/che-che4z-lsp-for-cobol-integration rev-parse HEAD)" = "$(sed -n 's/^che4zCommit=//p' gradle/cobol-rekt.properties)"
          test "$(git -C cobol-rekt-src/mojo-common rev-parse HEAD)" = "$(sed -n 's/^mojoCommonCommit=//p' gradle/cobol-rekt.properties)"
          test "$(git -C cobol-rekt-src/woof rev-parse HEAD)" = "$(sed -n 's/^woofCommit=//p' gradle/cobol-rekt.properties)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned cobol-rekt dependencies
        run: >-
          mvn --file cobol-rekt-src/pom.xml
          --projects smojol-core,smojol-toolkit
          --also-make install
          -DskipTests -Dmaven.test.skip=true -Dcheckstyle.skip
      - name: Verify build and architecture
        run: >-
          ./gradlew build qualityCheck
          :naca-trans:finalArchitectureCheck
          :naca-trans:templateJarCheck
          :naca-trans:templateJarSmoke
          :naca-trans:fpacAcceptance
          :naca-cloud-native:onlineCorpusBaseline
          --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  sample-acceptance:
    name: GnuCOBOL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnucobol
          cobc --version
      - name: Run strict sample acceptance
        run: ./gradlew sampleAcceptance --stacktrace
      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sample-acceptance-reports
          path: |
            naca-rt-tests/build/reports/tests/sampleAcceptance/**
            naca-rt-tests/build/test-results/sampleAcceptance/**
          if-no-files-found: warn
          retention-days: 14

  legacy-runtime-audit:
    name: Legacy runtime debt audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run compatibility suite
        id: legacy
        run: ./gradlew :naca-rt-tests:legacyRuntimeTest --stacktrace
      - name: Record audit status
        run: echo "Legacy runtime audit outcome：${{ steps.legacy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload legacy runtime reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-runtime-reports
          path: |
            naca-rt-tests/build/reports/tests/legacyRuntimeTest/**
            naca-rt-tests/build/test-results/legacyRuntimeTest/**
          if-no-files-found: warn
          retention-days: 30
