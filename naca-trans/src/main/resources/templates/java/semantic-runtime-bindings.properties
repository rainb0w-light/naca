# Embedded CICS verbs. CICS RETURN renders as a REFERENCE-role executable child;
# the template emits the CESM.returnTrans(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSReturn=recursiveCICSReturnEntity
# Embedded CICS SYNCPOINT renders as a REFERENCE-role executable child; the
# template emits the CESM.syncPointCommit()/syncPointRollback() runtime call.
semantic.CICS.CEntityCICSSyncPoint=recursiveCICSSyncPointEntity
# Embedded CICS XCTL renders as a REFERENCE-role executable child; the template
# emits the CESM.xctl(...).go()/.commarea(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSXctl=recursiveCICSXctlEntity
# Embedded CICS LINK renders as a REFERENCE-role executable child; the template
# emits the CESM.link(...).go()/.commarea(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSLink=recursiveCICSLinkEntity
# Embedded CICS ABEND renders as a REFERENCE-role executable child; the template
# emits the CESM.abend(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSAbend=recursiveCICSAbendEntity
# Embedded CICS ADDRESS renders as a REFERENCE-role executable child; the template
# emits the CESM.getAddressOfCWA/TCTUA/TWA(...) runtime calls (see java.stg).
semantic.CICS.CEntityCICSAddress=recursiveCICSAddressEntity
# Embedded CICS RECEIVE MAP renders as a REFERENCE-role executable child; the
# template emits the CESM.receiveMap(...).mapSet(...).into(...) runtime call.
semantic.CICS.CEntityCICSReceiveMap=recursiveCICSReceiveMapEntity
# Embedded CICS SEND MAP renders as a REFERENCE-role executable child; the template
# emits the CESM.sendMap(...).mapSet(...).dataFrom(...)/.dataOnlyFrom(...) runtime
# call plus its CURSOR/ACCUM/ALARM/ERASE/FREEKB/PAGING/WAIT option builder chain.
semantic.CICS.CEntityCICSSendMap=recursiveCICSSendMapEntity
# Embedded SQL WHENEVER (EXEC SQL WHENEVER SQLERROR|SQLWARNING ... END-EXEC). The
# statement emits NO code: its whole effect is a Stage-1 catalog side effect
# (registerSqlWheneverPolicy in CJavaEntityFactory, applied during semantic
# analysis). The template reads only entity.* properties and renders empty.
semantic.SQL.CEntitySqlOnErrorGoto=recursiveSqlOnErrorGotoEntity
# Test-only mock binding (MockDataEntity lives in the test source set; inert in
# production). Lets ST controller unit tests drive the recursive assembler.
generate.java.st.MockDataEntity=mockDataEntityReference
