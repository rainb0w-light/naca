# Embedded CICS verbs. CICS RETURN renders as a REFERENCE-role executable child;
# the template emits the CESM.returnTrans(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSReturn=recursiveCICSReturnEntity
# Embedded CICS SYNCPOINT renders as a REFERENCE-role executable child; the
# template emits the CESM.syncPointCommit()/syncPointRollback() runtime call.
semantic.CICS.CEntityCICSSyncPoint=recursiveCICSSyncPointEntity
# Embedded CICS XCTL renders as a REFERENCE-role executable child; the template
# emits the CESM.xctl(...).go()/.commarea(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSXctl=recursiveCICSXctlEntity
# Embedded CICS LINK renders as a REFERENCE-role executable child; the template
# emits the CESM.link(...).go()/.commarea(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSLink=recursiveCICSLinkEntity
