# Embedded CICS verbs. CICS RETURN renders as a REFERENCE-role executable child;
# the template emits the CESM.returnTrans(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSReturn=recursiveCICSReturnEntity
# Embedded CICS SYNCPOINT renders as a REFERENCE-role executable child; the
# template emits the CESM.syncPointCommit()/syncPointRollback() runtime call.
semantic.CICS.CEntityCICSSyncPoint=recursiveCICSSyncPointEntity
# Embedded CICS XCTL renders as a REFERENCE-role executable child; the template
# emits the CESM.xctl(...).go()/.commarea(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSXctl=recursiveCICSXctlEntity
# Embedded CICS LINK renders as a REFERENCE-role executable child; the template
# emits the CESM.link(...).go()/.commarea(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSLink=recursiveCICSLinkEntity
# Embedded CICS ABEND renders as a REFERENCE-role executable child; the template
# emits the CESM.abend(...) runtime call (see java.stg).
semantic.CICS.CEntityCICSAbend=recursiveCICSAbendEntity
# Embedded CICS ADDRESS renders as a REFERENCE-role executable child; the template
# emits the CESM.getAddressOfCWA/TCTUA/TWA(...) runtime calls (see java.stg).
semantic.CICS.CEntityCICSAddress=recursiveCICSAddressEntity
# Embedded CICS RECEIVE MAP renders as a REFERENCE-role executable child; the
# template emits the CESM.receiveMap(...).mapSet(...).into(...) runtime call.
semantic.CICS.CEntityCICSReceiveMap=recursiveCICSReceiveMapEntity
# Embedded CICS SEND MAP renders as a REFERENCE-role executable child; the template
# emits the CESM.sendMap(...).mapSet(...).dataFrom(...)/.dataOnlyFrom(...) runtime
# call plus its CURSOR/ACCUM/ALARM/ERASE/FREEKB/PAGING/WAIT option builder chain.
semantic.CICS.CEntityCICSSendMap=recursiveCICSSendMapEntity
# Embedded CICS ASKTIME renders as a REFERENCE-role executable child; the template
# emits the CESM.askTime() runtime call (see java.stg). Mirrors CJavaCICSAskTime.
semantic.CICS.CEntityCICSAskTime=recursiveCICSAskTimeEntity
# Embedded CICS ASSIGN renders as a REFERENCE-role executable child; the template
# emits the CESM.assign() runtime call chained with one .<OPTION>(<ref>) builder
# call per request (see java.stg). Mirrors CJavaCICSAssign.
semantic.CICS.CEntityCICSAssign=recursiveCICSAssignEntity
# Embedded CICS DEQ renders as a REFERENCE-role executable child; the template
# emits the CESM.deQ(<resource>) runtime call, adding ", <length>" when a LENGTH
# operand is present (see java.stg). Mirrors CJavaCICSDeQ.
semantic.CICS.CEntityCICSDeQ=recursiveCICSDeQEntity
# Embedded CICS ENQ renders as a REFERENCE-role executable child; the template
# emits the CESM.enQ(<resource>) runtime call, adding ", <length>" when a LENGTH
# operand is present (see java.stg). Mirrors CJavaCICSEnQ.
semantic.CICS.CEntityCICSEnQ=recursiveCICSEnQEntity
# Embedded CICS DELAY renders as a REFERENCE-role executable child; the template
# emits the CESM.delayInterval(...)/delaySeconds(...) runtime call (see java.stg).
# Mirrors CJavaCICSDelay.
semantic.CICS.CEntityCICSDelay=recursiveCICSDelayEntity
# Embedded CICS DELETEQ renders as a REFERENCE-role executable child; the template
# emits the CESM.deleteTransiantQueue(...)/deleteTempQueue(...) runtime call (see
# java.stg). Mirrors CJavaCICSDeleteQ.
semantic.CICS.CEntityCICSDeleteQ=recursiveCICSDeleteQEntity
# Embedded SQL WHENEVER (EXEC SQL WHENEVER SQLERROR|SQLWARNING ... END-EXEC). The
# statement emits NO code: its whole effect is a Stage-1 catalog side effect
# (registerSqlWheneverPolicy in CJavaEntityFactory, applied during semantic
# analysis). The template reads only entity.* properties and renders empty.
semantic.SQL.CEntitySqlOnErrorGoto=recursiveSqlOnErrorGotoEntity
# Embedded SQL DECLARE TABLE (EXEC SQL DECLARE TABLE ... END-EXEC). The statement
# emits NO code: its whole effect is a Stage-1 catalog side effect
# (RegisterSQLTable in the CEntitySQLDeclareTable constructor, applied during
# semantic analysis) so the SELECT/INSERT/UPDATE/DELETE backends can resolve the
# table's columns. The template reads only entity.* properties and renders empty.
semantic.SQL.CEntitySQLDeclareTable=recursiveSQLDeclareTableEntity
# SQL cursor references render as ordinary Java identifiers. This binding lets
# SQL statement templates keep cursors as semantic children instead of
# flattening them through ExportReference in a factory.
semantic.SQL.CEntitySQLCursor=dataReferenceEntity
# Embedded SQL CLOSE <cursor> (EXEC SQL CLOSE <cursor> END-EXEC). Renders the
# cursorClose(<ref>) runtime call; the SQLWARNING/SQLERROR clause (a read-only
# catalog lookup registered by the WHENEVER Stage-1 side effect) is chained onto
# it when present. The template reads only entity.* properties.
semantic.SQL.CEntitySQLCloseStatement=recursiveSQLCloseStatementEntity
# Embedded SQL SQLCODE condition (IF SQL-CODE = n / <> n). Renders the
# isSQLCode(<value>)/isNotSQLCode(<value>) BaseProgram condition call: well-known
# SQLCODE values render as SQLCode.* constants, any other value as a raw numeric
# literal. The template reads only entity.* properties.
semantic.SQL.CEntityCondIsSQLCode=recursiveCondIsSQLCodeEntity
# Embedded SQL SQLCODE / SQLERRD data reference. Renders the getSQLCode()
# BaseProgram call, or getSQLDiagnosticCode(<historyItem>) when an SQLERRD(n)
# history-item expression is present (recursively rendered through its reference
# binding). The template reads only entity.* properties.
semantic.SQL.CEntitySQLCode=recursiveSQLCodeEntity
# Embedded SQL CALL <program> [USING (:host, ...)] (EXEC SQL CALL ... END-EXEC).
# Renders the sqlCall(<programRef>) runtime call with one .param(N, <hostRef>) per
# host-variable parameter (1-based); the SQLWARNING/SQLERROR clause (a read-only
# catalog lookup registered by the WHENEVER Stage-1 side effect) is chained onto it
# when present. The program reference and each parameter stay semantic children and
# are recursively rendered through their reference bindings. The template reads only
# entity.* properties.
semantic.SQL.CEntitySQLCall=recursiveSQLCallEntity
# Embedded SQL COMMIT (EXEC SQL COMMIT END-EXEC). Renders the sqlCommit() runtime
# call; the SQLWARNING/SQLERROR clause (a read-only catalog lookup registered by
# the WHENEVER Stage-1 side effect) is chained onto it when present, before the
# " ;" terminator. The template reads only entity.* properties.
semantic.SQL.CEntitySQLCommit=recursiveSQLCommitEntity
# Embedded SQL ROLLBACK (EXEC SQL ROLLBACK END-EXEC). Renders the sqlRollback()
# runtime call; the SQLWARNING/SQLERROR clause (a read-only catalog lookup
# registered by the WHENEVER Stage-1 side effect) is chained onto it when present,
# before the " ;" terminator. The template reads only entity.* properties.
semantic.SQL.CEntitySQLRollBack=recursiveSQLRollBackEntity
# Embedded SQL EXECUTE IMMEDIATE :<host> (EXEC SQL EXECUTE IMMEDIATE ... END-EXEC).
# Renders the sql("EXECUTE IMMEDIATE #1").param(1, <hostRef>) runtime call; the
# SQLWARNING/SQLERROR clause (a read-only catalog lookup registered by the WHENEVER
# Stage-1 side effect) is chained onto it when present, before the " ;" terminator.
# The host variable stays a semantic child rendered through its reference binding;
# the template reads only entity.* properties.
semantic.SQL.CEntitySQLExecute=recursiveSQLExecuteEntity
# Embedded SQL cursor SELECT (the SELECT bound to a DECLARE CURSOR, rendered in
# place of the OPEN <cursor> statement). Renders the cursorOpen(<cursor>, "<select>")
# runtime call; an optional .setHoldability(true) (WITH HOLD), one 1-based
# .param(N, <hostRef>) per host-variable parameter, and the SQLWARNING/SQLERROR
# clause (a read-only catalog lookup registered by the WHENEVER Stage-1 side
# effect) chain onto it when present, before the " ;" terminator. The cursor and
# each parameter stay semantic children rendered through their reference bindings;
# the template reads only entity.* properties.
semantic.SQL.CEntitySQLCursorSelectStatement=recursiveSQLCursorSelectStatementEntity
# Embedded SQL DELETE FROM ... (EXEC SQL DELETE ... END-EXEC). Renders the
# sql("<statement>") runtime call for an unbound DELETE, or
# cursorDeleteCurrent(<cursor>, "<statement>") when a cursor is bound; one 1-based
# .param(N, <hostRef>) per host-variable parameter, and the SQLWARNING/SQLERROR
# clause (a read-only catalog lookup registered by the WHENEVER Stage-1 side
# effect) chain onto it when present, before the " ;" terminator. The cursor and
# each parameter stay semantic children rendered through their reference bindings;
# the template reads only entity.* properties.
semantic.SQL.CEntitySQLDeleteStatement=recursiveSQLDeleteStatementEntity
# Embedded SQL FETCH <cursor> INTO :host [, :ind] ... (EXEC SQL FETCH ... END-EXEC).
# Renders the cursorFetch(<cursor>) runtime call followed by one
# .into(<host>[, <ind>]) per INTO target (each paired with its optional INDICATOR
# variable), and the SQLWARNING/SQLERROR clause (a read-only catalog lookup
# registered by the WHENEVER Stage-1 side effect) chained onto it when present,
# before the " ;" terminator. The cursor, every INTO target and every INDICATOR stay
# semantic children rendered through their reference bindings; the template reads
# only entity.* properties.
semantic.SQL.CEntitySQLFetchStatement=recursiveSQLFetchStatementEntity
# Embedded SQL INSERT INTO ... (EXEC SQL INSERT ... END-EXEC). Renders the
# sql("<statement>") runtime call where <statement> is the full INSERT INTO ...
# text assembled in Stage 1 (NUMBER/STRING VALUES inlined as SQL literals, every
# other value a positional #N marker; or the INSERT ... SELECT clause). One 1-based
# .value(N, <hostRef>) is chained per non-inlined VALUES entry and per INSERT...SELECT
# host parameter, and the SQLWARNING/SQLERROR clause (a read-only catalog lookup
# registered by the WHENEVER Stage-1 side effect) chains onto it when present, before
# the " ;" terminator. The non-inlined VALUES entries and the SELECT host parameters
# stay semantic children rendered through their reference bindings; the template reads
# only entity.* properties.
semantic.SQL.CEntitySQLInsertStatement=recursiveSQLInsertStatementEntity
# Embedded SQL LOCK TABLE <table> IN EXCLUSIVE MODE (EXEC SQL LOCK TABLE ...
# END-EXEC). Renders the sql("LOCK TABLE <table> IN EXCLUSIVE MODE") runtime call
# where the full statement text is assembled in Stage 1 (read by
# <entity.statement>); the SQLWARNING/SQLERROR clause (a read-only catalog lookup
# registered by the WHENEVER Stage-1 side effect) is chained onto it when present,
# before the " ;" terminator. The template reads only entity.* properties.
semantic.SQL.CEntitySQLLock=recursiveSQLLockEntity
# Embedded SQL OPEN <cursor> (EXEC SQL OPEN <cursor> END-EXEC). When the cursor
# has a bound SELECT (its DECLARE CURSOR SELECT) that SELECT child is rendered in
# place of the OPEN statement; otherwise renders the cursorOpen(<ref>) runtime
# call, with the optional USING descriptor/host variable (a semantic child
# rendered through its reference binding) as the second argument, and the
# SQLWARNING/SQLERROR clause (a read-only catalog lookup registered by the
# WHENEVER Stage-1 side effect) chained onto the call when present, before the
# " ;" terminator. The template reads only entity.* properties.
semantic.SQL.CEntitySQLOpenStatement=recursiveSQLOpenStatementEntity
# Embedded SQL SELECT ... INTO :host [, :ind] ... (EXEC SQL SELECT ... END-EXEC),
# the standalone non-cursor form (a SELECT bound to a DECLARE CURSOR is a
# CEntitySQLCursorSelectStatement). Renders the sql("<statement>") runtime call
# where <statement> is the prepared SELECT text assembled in Stage 1 (read by
# <entity.statement>); one .into(<host>[, <ind>]) per INTO target (each paired by
# position with its optional INDICATOR variable), one 1-based .param(N, <hostRef>)
# per non-null host-variable parameter (null parameters dropped, original numbering
# kept), and the SQLWARNING/SQLERROR clause (a read-only catalog lookup registered
# by the WHENEVER Stage-1 side effect) chained onto it when present, before the
# " ;" terminator. Every parameter, INTO target and INDICATOR stay semantic children
# rendered through their reference bindings; the template reads only entity.*
# properties.
semantic.SQL.CEntitySQLSelectStatement=recursiveSQLSelectStatementEntity
# Embedded SQL session DECLARE (the DECLARE GLOBAL TEMPORARY TABLE statement
# assembled token-by-token by the parser CExecSQLSessionDeclare). Renders the
# sql("<statement>") runtime call where <statement> is the full DECLARE text
# carried by the entity (read by <entity.statement>); the SQLWARNING/SQLERROR
# clause (a read-only catalog lookup registered by the WHENEVER Stage-1 side
# effect) is chained onto it when present, before the " ;" terminator. The
# template reads only entity.* properties.
semantic.SQL.CEntitySQLSessionDeclare=recursiveSQLSessionDeclareEntity
# Embedded SQL session DROP (the DROP ... statement assembled token-by-token by
# the parser CExecSQLSessionDrop). Renders the sql("<statement>") runtime call
# where <statement> is the full DROP text carried by the entity (read by
# <entity.statement>); the SQLWARNING/SQLERROR clause (a read-only catalog lookup
# registered by the WHENEVER Stage-1 side effect) is chained onto it when present,
# before the " ;" terminator. The template reads only entity.* properties.
semantic.SQL.CEntitySQLSessionDrop=recursiveSQLSessionDropEntity
# Embedded SQL single statement (a raw EXEC SQL <text> END-EXEC that has no
# dedicated statement entity). Renders the legacy getDBConnection().execSQL("<statement>")
# runtime call where <statement> is the raw SQL text carried by the entity (read
# by <entity.statement>) and wrapped as a Java string literal. No WHENEVER
# SQLWARNING/SQLERROR clause is chained: the retired direct backend never read
# the policy, and the template mirrors it exactly. The template reads only
# entity.* properties.
semantic.SQL.CEntitySQLSingleStatement=recursiveSQLSingleStatementEntity
# Embedded SQL UPDATE ... (EXEC SQL UPDATE ... END-EXEC), either a standalone
# UPDATE <table> SET ... WHERE ... or a cursor-positioned UPDATE ... WHERE CURRENT
# OF <cursor>. Renders the sql("<statement>") runtime call where <statement> is the
# prepared UPDATE text assembled in Stage 1 (read by <entity.statement>), or
# cursorUpdateCurrent(<cursor>, "<statement>") when a cursor is bound (the cursor
# handle stays a semantic child rendered through its dataReferenceEntity binding);
# one 1-based .value(N, <hostRef>) per SET host-variable value, then one
# .param(N, <hostRef>) per non-null WHERE host-variable parameter (null parameters
# dropped; parameters continue the SET values' numbering, i.e. (i+1+sets.size()),
# exactly as the retired backend did), and the SQLWARNING/SQLERROR clause (a
# read-only catalog lookup registered by the WHENEVER Stage-1 side effect) chained
# onto it when present, before the " ;" terminator. Every SET value and parameter
# stays a semantic child rendered through its reference binding; the template reads
# only entity.* properties.
semantic.SQL.CEntitySQLUpdateStatement=recursiveSQLUpdateStatementEntity
# Test-only mock binding (MockDataEntity lives in the test source set; inert in
# production). Lets ST controller unit tests drive the recursive assembler.
generate.java.st.MockDataEntity=mockDataEntityReference
