# FPac file-EOF condition superclass alias. semantic.expression.CEntityIsFileEOF is ABSTRACT,
# so it is NOT a member of the concrete semantic inventory pinned by semantic-bindings.properties
# (and the final-architecture manifest test); the independent FPac pipeline instantiates it as
# generate.fpacjava.CFPacJavaIsFileEOF. The findTemplateName superclass walk resolves that concrete
# instance to this alias so the EOF condition is renderable as a reference — in particular as the
# OPERAND of a wrapping pure semantic.expression.CEntityCondNot (CFPacJavaIsFileEOF.GetOppositeCondition
# negates EOF because there is no isNotEof runtime call; recursiveCondNotEntity renders !(<entity.operand>),
# which must be able to render this operand). Loaded into both REFERENCE (loadDefault) and FPAC_REFERENCE
# (loadFpac); kept disjoint from the concrete inventory manifest. The template reuses the shared
# recursiveFileDescriptorEntity binding for the descriptor name, exactly as recursiveCloseFileEntity does.
semantic.expression.CEntityIsFileEOF=recursiveIsFileEOFEntity
