# Root-role bindings: top-level program / artifact roots that the single
# assembler flatten point (JavaTemplateAssembler.renderRoot) renders. This
# manifest is deliberately separate from the reference and declaration
# manifests; bindingsFor(ROOT) consults ONLY this file and never falls back to
# the default manifest, so a root type without an explicit binding fails closed.
semantic.CEntityClass=javaProgramRoot
semantic.forms.CEntityResourceFormContainer=bmsMapsetRoot
semantic.CEntityExternalDataStructure=javaCopyClass
