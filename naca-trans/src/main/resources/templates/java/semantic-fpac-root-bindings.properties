# FPac pipeline root-role bindings (JavaTemplateRole.FPAC_ROOT).
#
# The independent FPac pipeline shares the target-neutral semantic model with COBOL,
# including its program root semantic.CEntityClass. But the two pipelines WRAP that
# root differently, and one semantic class maps to exactly one wrapper per pipeline:
#
#   - COBOL (semantic-root-bindings.properties, role ROOT):
#       semantic.CEntityClass=javaProgramRoot
#     -> "public class Prog extends BatchProgram/CalledProgram/..." + nacaLib.program imports.
#
#   - FPac (this manifest, role FPAC_ROOT):
#       semantic.CEntityClass=recursiveFPacClassEntity
#     -> "import nacaLib.fpacPrgEnv.* ;" + "public class PROG extends FPacProgram", the
#        class name UPPERCASE (GetName().replace('-','_').toUpperCase()), exactly as the
#        retired generate.fpacjava.CFPacJavaClass.DoExport emitted.
#
# bindingsFor(FPAC_ROOT) consults ONLY this manifest and never falls back to the COBOL
# root manifest, so the frozen COBOL javaProgramRoot binding is left untouched and an
# FPac root type without an explicit binding fails closed. Children of the FPac root
# render under FPAC_REFERENCE (see JavaTemplateAssembler.childRole).
semantic.CEntityClass=recursiveFPacClassEntity
