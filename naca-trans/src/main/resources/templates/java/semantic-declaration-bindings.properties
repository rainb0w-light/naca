# Data-division declaration bindings. These are deliberately separate from
# reference bindings because the same semantic entity has both roles.
semantic.CEntityAttribute=dataAttributeDeclaration
semantic.CEntityStructure=dataStructureDeclaration
semantic.CEntityDataSection=dataSectionDeclaration
# Embedded SQL cursor declaration section (DECLARE CURSOR ...): a DATA-DIVISION
# section declaring the program's SQLCursor handles. Rendered by its own template
# (the generic dataSectionDeclaration only knows the working-storage / linkage /
# file / variable section kinds). Concrete-type binding wins over the
# CEntityDataSection superclass binding via superclass-walk lookup.
semantic.CEntitySQLCursorSection=recursiveSQLCursorSectionEntity
semantic.CEntityNamedCondition=dataNamedConditionDeclaration
semantic.CEntityFileDescriptor=dataFileDescriptorDeclaration
semantic.CEntitySortedFileDescriptor=dataSortedFileDescriptorDeclaration
semantic.CEntityFileDescriptorLengthDependency=dataFileDescriptorLengthDependencyDeclaration
semantic.CEntityIndex=dataIndexDeclaration
semantic.CEntityInline=dataInlineDeclaration
semantic.CEntityUnknownReference=unknownReferenceEntity
semantic.expression.CEntityInternalBool=internalBooleanDeclaration
# Independent BMS artifact island: an entry field has a Java declaration role
# distinct from its plain data-reference role in semantic-runtime-bindings.
semantic.forms.CEntityResourceField=recursiveResourceFieldDeclarationEntity
semantic.forms.CEntityResourceForm=recursiveFormDeclarationBlockEntity
semantic.forms.CEntityFormRedefine=recursiveFormRedefineDeclarationBlockEntity
semantic.forms.CEntitySkipFields=recursiveSkipFieldDeclarationBlockEntity
semantic.forms.CEntityFieldRedefine=recursiveFieldRedefineDeclarationBlockEntity
semantic.forms.CEntityFieldOccurs=recursiveFieldOccursDeclarationBlockEntity
semantic.forms.CEntityResourceFieldArray=recursiveFieldArrayDeclarationEntity
semantic.forms.CEntityLabelField=emptyBmsDeclarationEntity
semantic.forms.CEntityFieldData=emptyBmsDeclarationEntity
