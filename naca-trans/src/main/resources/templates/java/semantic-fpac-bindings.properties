# FPac pipeline reference-rendering overrides (JavaTemplateRole.FPAC_REFERENCE).
#
# The independent FPac pipeline shares the target-neutral semantic model with COBOL
# and reuses the shared reference manifest verbatim for almost every verb (see
# JavaSemanticTemplateBindings.loadFpac(), which layers this file ON TOP of
# semantic-bindings.properties + semantic-runtime-bindings.properties). Only the
# semantic types whose FPac lowering genuinely differs from COBOL are overridden here.
#
# CEntityCallFunction: COBOL renders it as a PERFORM (recursiveCallFunctionEntity ->
# perform(...)/performThrough(...)). FPac's DOSUBR lowers to a DIRECT call to the
# generated paragraph method, "name() ;" (the method CFPacJavaProcedure emits via
# CJavaExporter.FormatIdentifier(getName())). This override keeps the frozen COBOL
# PERFORM binding intact while giving FPac its own recursive ST4 template.
semantic.Verbs.CEntityCallFunction=recursiveFPacCallFunctionEntity

# CEntityCallProgram: COBOL renders a checked CALL "PROG" as call(Prog.class) using the
# title-case javaClassName format (CobolNameUtil.fixJavaName). The independent FPac pipeline
# names its generated PROGRAM classes UPPERCASE (CFPacJavaClass.DoExport:
# GetName().replace('-', '_').toUpperCase()), so call(Prog.class) would NOT compile against
# "public class PROG extends FPacProgram". This override keeps the frozen COBOL
# recursiveCallProgramEntity binding intact while giving FPac its own recursive ST4 template
# that is identical in SHAPE (call(...).using(...).executeCall();) but references the program
# class with the fpacClassName (uppercase) format. The runtime chain (BaseProgram.call ->
# CCallProgram.using/executeCall/executeCallSafe) is shared and runtime-legal for FPac because
# nacaLib.fpacPrgEnv.FPacProgram extends nacaLib.basePrgEnv.BaseProgram.
semantic.Verbs.CEntityCallProgram=recursiveFPacCallProgramEntity

# CEntityDisplay: COBOL renders this shared verb with the `display` template (a single
# console().display/displayEnv/display call joining all operands with " + "). The independent
# FPac pipeline lowers a WTO differently: the retired FPac display backend wrote ONE
# "wto.display(<ref>) ;" console statement PER OPERAND, where <ref> was
# LegacyDataRenderer.renderReference(item, getLine()) and "wto" is the protected
# nacaLib.varEx.Console field on nacaLib.fpacPrgEnv.FPacProgram. This override keeps the frozen
# COBOL `display` binding intact while giving FPac its own recursive ST4 template that reads only
# the entity's precomputed per-operand reference strings (getDisplayReferences, populated through
# the injected renderReference bridge). The operands are deliberately NOT rendered through the
# assembler reference walk: the still-legacy FPac operand types (positioned substring + conversion
# buffer, numeric/string literal, undefined reference) carry their own reference protocol, and the
# walk would re-route them to the shared COBOL templates and diverge or emit invalid Java.
semantic.Verbs.CEntityDisplay=recursiveFPacDisplayEntity
