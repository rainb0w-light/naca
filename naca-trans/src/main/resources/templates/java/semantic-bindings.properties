# FPac-only conversion reference (COBOL's CJavaEntityFactory.NewEntityConvert throws
# "not implemented", so this semantic type is instantiated solely by the independent
# FPac pipeline). It is bound here in the SHARED reference manifest — not the FPac
# override manifest — because the FPac production path reaches it through
# LegacyDataRenderer.renderReference, whose reflective fallback renders under
# JavaTemplateRole.REFERENCE (which consults only the shared manifests). The template
# reproduces the retired generate.fpacjava.CFPacJavaConvertReference.ExportReference
# shapes; the bufferP/bufferX branch is an intentional unclosed call head completed by
# the wrapping CSubStringAttributReference (see recursiveFPacConvertReferenceEntity).
semantic.Verbs.CEntityConvertReference=recursiveFPacConvertReferenceEntity
# FPac-only transparent formatted reference. It is bound in the shared reference
# manifest because the compatibility bridge falls back under REFERENCE; the FPac
# manifest inherits this binding. The edit format remains semantic state for a
# future action-based formatted write and is not interpreted while reading.
