  # assign() returns the legacy nacaLib.misc.CCESMFakeMethodContainer, whose
  # APPLID(Var) / TCTUALENG(Var) builder methods (the two operand keywords the
  # production parser admits) each return the container so the calls chain on a
  # single CESM statement, mirroring CJavaCICSAssign.DoExport. Declared on the
  # exact classes that carry the methods, like cics.receiveMap.
