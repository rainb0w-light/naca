  # BMS map-resource DSL: the <FIELD>-H highlight pseudo-variable reference
  # (retired direct backend CJavaFieldHighligh) emits getHighlighting(<owner
  # field>), resolved by OnlineProgram.getHighlighting(Edit).
  fieldHighlightReferenceEntity:
    capability: BMS_MAP
    requires:
      - bms.highlight.get

  # BMS map-resource DSL: the <FIELD>P flag pseudo-variable reference (retired
  # direct backend CJavaFieldFlag) emits <owner field>.getFlag(), resolved by
  # Edit.getFlag().
  fieldFlagReferenceEntity:
    capability: BMS_MAP
    requires:
      - bms.flag.get

  # BMS map-resource DSL: the get-key-pressed pseudo-variable reference (retired
  # direct backend CJavaGetKeyPressed) emits the bare no-argument getKeyPressed()
  # program call, resolved by BaseProgram.getKeyPressed(). The reference is dead
  # wiring in production (every real use lowers through
  # CEntityGetKeyPressed.GetSpecialCondition/GetSpecialAssignment into
  # CEntityIsKeyPressed/CEntityResetKeyPressed), but the call is declared so the
  # template emits only a contracted runtime operation.
  recursiveGetKeyPressedEntity:
    capability: BMS_MAP
    requires:
      - bms.keyPressed.get

  # BMS map-resource DSL: the AID-key test condition (IF KEYPRESSED = <key> / <> <key>,
  # retired direct backend CJavaIsKeyPressed) emits one of two protected BaseProgram
  # condition calls, selected by the entity's bIsNot flag: isKeyPressed(nacaLib.misc.KeyPressed)
  # for the positive test, isNotKeyPressed(nacaLib.misc.KeyPressed) for the negated test. Both
  # are real runtime methods and both are listed because each is reachable on a template branch
  # (the template branches on entity.opposite to select the call).
  recursiveIsKeyPressedEntity:
    capability: BMS_MAP
    requires:
      - bms.keyPressed.is
      - bms.keyPressed.isNot

  # BMS map-resource DSL: the reset-key-pressed action statement (MOVE SPACE TO KEYPRESSED,
  # retired direct backend CJavaResetKeyPressed) emits the protected no-argument
  # BaseProgram.resetKeyPressed() call, exactly the legacy DoExport line "resetKeyPressed();".
  # The action is dead wiring in production (no shipped BMS program performs MOVE SPACE TO
  # KEYPRESSED), but the call is declared so the template emits only a contracted runtime
  # operation.
  recursiveResetKeyPressedEntity:
    capability: BMS_MAP
    requires:
      - bms.keyPressed.reset

  # BMS map-resource DSL: the cursor action statement (MOVE ... TO <FIELD>-L,
  # retired direct backend CJavaSetCursor) emits one of the protected
  # OnlineProgram cursor calls: moveCursor(<value>, <field>) for a set
  # reference value (both runtime overload families), removeCursor(<field>)
  # for the remove flag, otherwise setCursor(<field>).
  # BMS map-resource DSL: the field-modified condition (IF <FIELD>-L > 0, retired
  # direct backend CJavaIsFieldModified) emits the protected OnlineProgram
  # isFieldModified(Edit) condition call (negation rides a pure CEntityCondNot ->
  # recursiveCondNotEntity, no extra runtime call).
  recursiveIsFieldModifiedEntity:
    capability: BMS_MAP
    requires:
      - bms.field.modified

  # BMS map-resource DSL: the field-cursor condition (IF <FIELD>-L = -1 / <> -1, retired
  # direct backend CJavaIsFieldCursor) emits one of two protected OnlineProgram condition
  # calls, selected by the entity's hasCursor flag: isFieldHasCursor(Edit) for
  # IF <FIELD>-L = -1, isNotFieldHasCursor(Edit) otherwise. Both are real runtime methods
  # and both are listed because each is reachable on a template branch.
  recursiveIsFieldCursorEntity:
    capability: BMS_MAP
    requires:
      - bms.field.cursor.has
      - bms.field.cursor.hasNot

  # BMS map-resource DSL: the field-color condition (IF <FIELD>C = <color-code> /
  # <> <color-code>, retired direct backend CJavaIsFieldColor) emits one of two protected
  # OnlineProgram condition calls, selected by the entity's isopposite flag:
  # isFieldColored(Edit, MapFieldAttrColor) for IS_EQUAL, isNotFieldColored(Edit,
  # MapFieldAttrColor) for IS_DIFFERENT. Both are real runtime methods and both are
  # listed because each is reachable on a template branch.
  recursiveIsFieldColorEntity:
    capability: BMS_MAP
    requires:
      - bms.field.color.is
      - bms.field.color.isNot

  # BMS map-resource DSL: the field-highlight condition (IF <FIELD>H = <code> /
  # <> <code>, retired direct backend CJavaIsFieldHighlight) emits one of the seven
  # protected OnlineProgram highlight condition calls, selected by the entity's mode
  # flags (precedence underlined > blink > reverse > normal) and its isopposite flag:
  # isFieldUnderlined / isNotFieldUnderlined, isFieldBlink, isFieldReverse /
  # isNotFieldReverse, isFieldHighlightNormal / isNotFieldHighlightNormal. All seven
  # contracted calls are real OnlineProgram methods and all seven are listed because
  # each is reachable on a template branch. The blink + opposite branch does NOT emit
  # a separate call: the legacy isNotFieldBlink has no naca-rt implementation, so that
  # branch renders the Java negation !isFieldBlink(<ref>) of the already-listed
  # bms.field.highlight.blink operation (semantically identical, compilable) — no
  # eighth operation is required or declared.
  recursiveIsFieldHighlightEntity:
    capability: BMS_MAP
    requires:
      - bms.field.highlight.underlined
      - bms.field.highlight.underlined.not
      - bms.field.highlight.blink
      - bms.field.highlight.reverse
      - bms.field.highlight.reverse.not
      - bms.field.highlight.normal
      - bms.field.highlight.normal.not

  # BMS map-resource DSL: the field-flag condition (IF <FIELD>P = 1 / 0 / LOW-VALUE,
  # retired direct backend CJavaIsFieldFlag) emits one of four protected OnlineProgram
  # condition calls, selected by the entity's isSet and isopposite flags:
  # isFieldFlag(Edit, String) / isNotFieldFlag(Edit, String) for a value test
  # (IF <FIELD>P = 1 / 0) and isFieldFlagSet(Edit) / isNotFieldFlagSet(Edit) for the set
  # test (IF <FIELD>P = LOW-VALUE). All four are real runtime methods and all four are
  # listed because each is reachable on a template branch.
  recursiveIsFieldFlagEntity:
    capability: BMS_MAP
    requires:
      - bms.field.flag
      - bms.field.flag.not
      - bms.field.flag.set
      - bms.field.flag.setNot

  # BMS map-resource DSL: the field-attribute condition (retired direct backend
  # CJavaIsFieldAttribute) emits the protected OnlineProgram.isFieldAttribute(Edit,
  # VarAndEdit) call for a compared value and, otherwise, up to three attribute terms drawn
  # from the field-attribute helpers (autoSkip/numeric/unprotected/bright/dark/modified/
  # unmodified/cleared and their negations; isFieldModified is the existing bms.field.modified
  # operation). Every contracted call below is a real OnlineProgram method. The legacy
  # isFieldProtected/isNotFieldProtected/isNotFieldAttribute/isNotFieldUnmodified branches
  # have no runtime implementation (pre-existing latent debt in unreachable dead code) and
  # are intentionally absent from this list.
  recursiveIsFieldAttributeEntity:
    capability: BMS_MAP
    requires:
      - bms.field.attribute
      - bms.field.autoSkip
      - bms.field.autoSkip.not
      - bms.field.numeric
      - bms.field.numeric.not
      - bms.field.unprotected
      - bms.field.unprotected.not
      - bms.field.bright
      - bms.field.bright.not
      - bms.field.dark
      - bms.field.dark.not
      - bms.field.modified
      - bms.field.modified.not
      - bms.field.unmodified
      - bms.field.cleared
      - bms.field.cleared.not

  recursiveSetCursorEntity:
