    requires:
      - bms.cursor.set
      - bms.cursor.remove
      - bms.cursor.move.edit
      - bms.cursor.move.var

  # BMS map-resource DSL: the color action statement (MOVE <val> TO <FIELD>-C,
  # retired direct backend CJavaSetColor) emits the protected OnlineProgram
  # moveColor overloads: moveColor(MapFieldAttrColor.<name>, <field>) for a set
  # color constant and for the NEUTRAL fall-through (the MapFieldAttrColor
