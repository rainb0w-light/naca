  # BMS map-resource DSL: the attribute action statement (MOVE <attr> TO <FIELD>,
  # retired direct backend CJavaSetAttribute) emits the protected OnlineProgram
  # moveAttribute overloads: moveAttribute(<value>, <field>) for a moved attribute
  # value (the Var overload), otherwise one call per attribute group selecting a
  # nacaLib.mapSupport constant — protection (MapFieldAttrProtection), intensity
  # (MapFieldAttrIntensity) and modified (MapFieldAttrModified).
  recursiveSetAttributeEntity:
    capability: BMS_MAP
    requires:
      - bms.attribute.protection
      - bms.attribute.intensity
      - bms.attribute.modified
      - bms.attribute.move.var

  # BMS map-resource DSL: the highlight action statement (MOVE <val> TO <FIELD>-H,
  # retired direct backend CJavaSetHighlight) emits the protected OnlineProgram
  # highlight calls: setFieldBlink/setFieldReverse/setFieldUnderline/
  # setFieldUnhighlighted for the independent blink/reverse/underline/normal flags
  # (the normal and legacy reset branches both map to setFieldUnhighlighted), and
  # moveHighLighting(<value>, <field>) for a moved value (both runtime overload
  # families).
  recursiveSetHighlightEntity:
    capability: BMS_MAP
    requires:
      - bms.highlight.blink
      - bms.highlight.reverse
      - bms.highlight.underline
      - bms.highlight.unhighlighted
      - bms.highlight.move.var
      - bms.highlight.move.attr

  # BMS map-resource DSL: the flag action statement (MOVE <val> TO <FIELD>P,
  # retired direct backend CJavaSetFlag) emits one of the protected OnlineProgram
  # flag calls: moveFlag("<value>", <field>) (the String overload, constant
  # quoted verbatim) for a non-null flag value, otherwise resetFlag(<field>).
  recursiveSetFlagEntity:
    capability: BMS_MAP
    requires:
      - bms.flag.move
      - bms.flag.reset
