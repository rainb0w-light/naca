      template: recursiveSQLCloseStatementEntity
    # cursorClose(...) is a BaseProgram helper, not a Codegen-Runtime Contract
    # operation (same treatment as the sql.cursorSection declare.* builder calls);
    # the optional .onErrorGoto(...)/.onErrorContinue() clause is the WHENEVER
    # policy registered by sql.whenever's Stage-1 side effect. No runtime operation.
    runtimeOperations: []
    fixtures: []
