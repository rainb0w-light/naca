  - id: sql.cursorSection
    dialects: [embedded-sql]
    semanticType: semantic.CEntitySQLCursorSection
    javaBackend:
      role: DECLARATION
      template: recursiveSQLCursorSectionEntity
    # declare.cursorSection()/declare.cursor() are DataDeclaration builder calls,
