    # The retired CFPacJavaArrayReference backend emitted "reference(idx)" — a field
    # invoked with (), which is not valid Java array access; FPac converges onto the
    # canonical naca-rt accessor COBOL already emits for this same entity (runtime-legal:
    # nacaLib.varEx.Var declares getAt(int) and getAt(int,int)). No runtime-op is declared
    # because .getAt(...) is a method on the data entity, not a contract operation.
    runtimeOperations: []
    fixtures: []
    status: production

  - id: fpac.data.move
    dialects: [fpac]
    semanticType: semantic.Verbs.CEntityAssign
    javaBackend:
      role: REFERENCE
      template: recursiveMoveEntity
    # FPac shares the target-neutral semantic.Verbs.CEntityAssign with COBOL and reuses
    # the frozen recursiveMoveEntity binding ("move(<value>, <destination>);"). The retired
    # CFPacJavaAssign backend emitted the same plain move(...) statement (with a stray ") ;"
    # spacing); FPac converges onto the canonical shape COBOL already emits for this entity.
    # FPac only ever populates value + destinations (never fillAll/corresponding), so the
    # shared template always lowers to the plain move overloads; the full move op set is
    # declared because the template is shared verbatim with COBOL. Runtime-legal:
    # nacaLib.fpacPrgEnv.FPacProgram extends nacaLib.basePrgEnv.BaseProgram, which declares move.
    runtimeOperations: [data.move.varEdit, data.move.editVar, data.move.editEdit, data.moveAll, data.moveCorresponding]
    fixtures: []
    status: production

  - id: fpac.data.movePacked
    dialects: [fpac]
    semanticType: semantic.Verbs.CEntityAssignSpecial
    javaBackend:
      role: REFERENCE
      template: recursiveMovePackedEntity
    # FPac-only packed-decimal move. The retired CFPacJavaAssignSpecial backend emitted
    # "movePacked(<source>, <destination>) ;" (stray space before the semicolon) and only
    # when arithmeticAssign was set; FPac converges onto the canonical
    # "movePacked(<source>, <destination>);" rendered by the recursiveMovePackedEntity
    # binding, which reads only entity.source / entity.destination. The packed branch of
    # the FPac parser is the sole populator and always sets arithmeticAssign, so the
    # template always lowers to the one runtime call. Runtime-legal:
    # nacaLib.fpacPrgEnv.FPacProgram declares movePacked(Var, Var), delegating to
    # nacaLib.basePrgEnv.BaseProgram.move(Var, Var).
    runtimeOperations: [data.movePacked]
    fixtures: []
    status: production

  - id: fpac.data.assignWithAccessor
    dialects: [fpac]
    semanticType: semantic.Verbs.CEntityAssignWithAccessor
    javaBackend:
      role: REFERENCE
      template: recursiveAssignWithAccessorEntity
    # FPac shares the target-neutral semantic.Verbs.CEntityAssignWithAccessor with COBOL and
    # reuses the frozen recursiveAssignWithAccessorEntity binding. The only FPac destination
    # that carries accessors is a CFPacJavaEnvironmentVariable built from the rules engine
    # (e.g. RETCD, writer "setReturnCode("), so the environment branch lowers to
    # "setReturnCode(<value>);". The retired CFPacJavaAssignWithAccessor backend appended a
    # redundant ".getInt()" plus a stray " ;"; both are dropped because BaseProgram declares a
    # setReturnCode(Var) overload that coerces the value internally. FPac never populates
    # fillAll and never builds a CEntitySQLCode, so those branches are unreachable from FPac.
    # The environment write call is user-configured from the rules XML (not a contract
    # operation, same as cobol.data.environment-variable); sqlcode.reset covers the shared
    # template's SQLCode branch.
    runtimeOperations: [sqlcode.reset]
    fixtures: []
    status: production

  - id: fpac.control.callFunction
    dialects: [fpac]
    semanticType: semantic.Verbs.CEntityCallFunction
    javaBackend:
      role: FPAC_REFERENCE
      template: recursiveFPacCallFunctionEntity
    # FPac shares the target-neutral semantic.Verbs.CEntityCallFunction with COBOL, but its
    # lowering genuinely differs: COBOL renders this class as a PERFORM
    # (recursiveCallFunctionEntity, REFERENCE role), whereas an FPac DOSUBR is a DIRECT call
    # to the generated paragraph method, "name() ;". The FPAC_REFERENCE role layers
    # semantic-fpac-bindings.properties over the shared reference manifest and redirects ONLY
    # this class to recursiveFPacCallFunctionEntity, leaving the frozen COBOL PERFORM binding
    # intact. The retired CFPacJavaCallFunction backend emitted "formatIdentifier(name)() ;";
    # the template reproduces it via the fpacIdentifier format, which applies the exact same
    # CJavaExporter.FormatIdentifier rules CFPacJavaProcedure uses to NAME the method, so the
    # call always matches and compiles. No runtime-op is declared: the emitted call targets the
    # generated paragraph method itself, not a naca-rt operation.
    runtimeOperations: []
    fixtures: []
    status: production

  - id: fpac.program.call
    dialects: [fpac]
    semanticType: semantic.Verbs.CEntityCallProgram
    javaBackend:
      role: FPAC_REFERENCE
      template: recursiveFPacCallProgramEntity
    # FPac shares the target-neutral semantic.Verbs.CEntityCallProgram with COBOL and reuses the
    # SAME lowering SHAPE — call(<program>).using(...).executeCall(); — but its program-class
    # naming genuinely differs, so the FPAC_REFERENCE role layers semantic-fpac-bindings.properties
    # over the shared reference manifest and redirects ONLY this class to
    # recursiveFPacCallProgramEntity, leaving the frozen COBOL recursiveCallProgramEntity binding
    # intact. The COBOL template references a checked literal CALL "PROG" as call(Prog.class) via
    # the title-case javaClassName format (CobolNameUtil.fixJavaName). FPac names generated program
    # classes UPPERCASE (CFPacJavaClass.DoExport: GetName().replace('-','_').toUpperCase()), so the
    # template applies the fpacClassName format to emit call(PROG.class), matching
    # "public class PROG extends FPacProgram"; call(Prog.class) would not compile. The retired
    # CFPacJavaCallProgram backend used the raw literal text (call(PROG.class) for an uppercase
    # source literal, but call(prog.class) for a lowercase one — a latent casing defect) and, on the
    # unchecked error path, wrapped the name in quotes WITH a stray ".class" suffix; the template
    # reproduces the correct uppercase form and drops the buggy ".class"-in-string. The runtime
    # chain (BaseProgram.call -> CCallProgram.using/executeCall/executeCallSafe) is shared and
    # runtime-legal for FPac because nacaLib.fpacPrgEnv.FPacProgram extends nacaLib.basePrgEnv.BaseProgram.
    # FPac's parser (CFPacCall) never calls SetOnErrorBloc, so the executeCallSafe branch is
    # unreachable from FPac; it is retained in the template only for totality with the COBOL shape.
    runtimeOperations: [program.call, program.call.using, program.call.executeCall, program.call.executeCallSafe]
    fixtures: []
    status: production

  - id: fpac.program.root
    dialects: [fpac]
    semanticType: semantic.CEntityClass
    javaBackend:
      role: FPAC_ROOT
      template: recursiveFPacClassEntity
    # The independent FPac pipeline shares the target-neutral semantic.CEntityClass program root
    # with COBOL, but wraps it differently, so a dedicated FPAC_ROOT role consults ONLY
    # semantic-fpac-root-bindings.properties (never the COBOL root manifest). COBOL binds
    # semantic.CEntityClass to javaProgramRoot ("public class Prog extends BatchProgram/..." +
    # nacaLib.program imports); FPac wraps the SAME semantic type as
    # "import nacaLib.fpacPrgEnv.* ;" + "public class PROG extends FPacProgram", the class name
    # UPPERCASE via the fpacClassName format (GetName().replace('-','_').toUpperCase()), exactly
    # as the retired generate.fpacjava.CFPacJavaClass.DoExport emitted. The frozen COBOL ROOT
    # binding is left untouched. The wrapper declares no runtime operation of its own (the base
    # type FPacProgram and the wildcard import are template concerns, like COBOL's
    # cobol.program.root which also carries runtimeOperations: []); the body's verbs carry their
    # own FPac features and lower under FPAC_REFERENCE.
    runtimeOperations: []
    fixtures: []
    status: production

