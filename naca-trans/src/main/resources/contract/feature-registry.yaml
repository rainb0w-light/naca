  - id: fpac.condition.and
    dialects: [fpac]
    semanticType: semantic.expression.CEntityCondAnd
    javaBackend:
      role: REFERENCE
      template: recursiveCondAndEntity
    # FPac shares the target-neutral semantic.expression.CEntityCondAnd with COBOL and
    # reuses the frozen recursiveCondAndEntity binding (priority-1 grouping, " \n&& " join,
    # ignored-operand collapse). The retired CFPacJavaCondAnd backend carried an Export()
    # override emitting the same "left \n&& right" shape; FPac converges onto the canonical
    # shared template COBOL already emits for this same entity. The entity's getters
    # (getEffectiveLeft/Right, isLeft/RightIgnored/Grouped) are pure state reads populated
    # by the parser, so no runtime-op is declared.
    runtimeOperations: []
    fixtures: []
    status: production

  - id: fpac.condition.equals
    dialects: [fpac]
    semanticType: semantic.expression.CEntityCondEquals
    javaBackend:
      role: REFERENCE
      template: recursiveCondEqualsEntity
    # FPac shares the target-neutral semantic.expression.CEntityCondEquals with COBOL and
    # reuses the frozen recursiveCondEqualsEntity binding ("isEqual(left, right)" /
    # "isDifferent(left, right)" with the "[UNDEFINED]" missing-right fallback). The
    # retired CFPacJavaCondEquals backend carried an Export() override emitting the same
    # shape; FPac converges onto the canonical shared template COBOL already emits for
    # this same entity. The entity's getters (getLeft/getRight/isDifferent) are pure
    # state reads populated by the parser's SetEqualCondition/SetDifferentCondition; the
    # isEqual/isDifferent predicates are BaseProgram runtime calls that FPacProgram
    # inherits, so FPac declares the same operations as cobol.condition.equals.
    runtimeOperations: [compare.equal.varVar, compare.different.varVar]
    fixtures: []
    status: production

  - id: fpac.condition.isBoolean
    dialects: [fpac]
    semanticType: semantic.expression.CEntityCondIsBoolean
    javaBackend:
      role: REFERENCE
      template: recursiveCondIsBooleanEntity
    # FPac-only condition (COBOL never instantiates CEntityCondIsBoolean — its factory
    # throws — so there is no cobol.* counterpart). The parser lowers the IF
    # read-and-test-file pattern (parser/FPac/elements/CFPacCodeBloc) into the pure
    # target-neutral semantic.expression.CEntityCondIsBoolean via setIsTrue/setIsFalse,
    # and the shared recursiveCondIsBooleanEntity binding emits the bare data reference,
    # "!"-prefixed when negated — exactly the shape the retired CFPacJavaCondIsBoolean
    # Export() produced. The entity's getters (isTrueValue/getConditionReference) are
    # pure state reads; no runtime operation is emitted beyond the reference itself,
    # which unfolds through the assembler's reference binding.
    runtimeOperations: []
    fixtures: []
    status: production

  - id: fpac.condition.isConstant
    dialects: [fpac]
    semanticType: semantic.expression.CEntityCondIsConstant
    javaBackend:
      role: REFERENCE
      template: recursiveCondIsConstantEntity
    # FPac shares the target-neutral semantic.expression.CEntityCondIsConstant with COBOL
    # and reuses the frozen recursiveCondIsConstantEntity binding
    # ("is[Not](Zero|Space|LowValue|HighValue)(<reference>)"). The retired
    # CFPacJavaCondIsConstant backend carried an Export() override emitting exactly that
    # shape; FPac converges onto the canonical shared template COBOL already emits for this
    # same entity (parser/FPac/CFPacGenericExpression lowers IF X = SPACE/LOW-VALUE/... via
    # SetIsSpace/SetIsZero/... and COppositeExpression flips SetOpposite for "<>"). The
    # entity's getters (isOpposite/isZero/isSpace/isLowValue/isHighValue/getConditionReference)
    # are pure state reads populated by the parser; the is[Not](Zero|Space|LowValue|HighValue)
    # predicates are BaseProgram runtime calls that FPacProgram inherits, so FPac declares
    # the same operations as cobol.condition.figurative-constant.
    runtimeOperations:
      - condition.isZero.var
      - condition.isNotZero.var
      - condition.isSpace.var
      - condition.isNotSpace.var
      - condition.isLowValue.var
      - condition.isNotLowValue.var
      - condition.isHighValue.var
      - condition.isNotHighValue.var
    fixtures: []
    status: production

