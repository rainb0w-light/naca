    javaBackend:
      role: REFERENCE
      template: addressExpressionEntity
    # The FPac address terminal (&ADDR) lowers to a fully-resolved address literal;
    # the template reads the precomputed value and emits no naca-rt runtime call.
    runtimeOperations: []
    fixtures: []
